    // ==========================================
    // BĂM MẬT KHẨU SHA-256
    // ==========================================
    const sha256Fallback = (ascii) => {
      const rightRotate = (v, a) => (v >>> a) | (v << (32 - a));
      const maxWord = Math.pow(2, 32);
      let result = '';
      const words = [];
      const asciiBitLength = ascii.length * 8;
      let hash = [], k = [], primeCounter = 0;
      const isComposite = {};
      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      ascii += '\x80';
      while ((ascii.length % 64) - 56) ascii += '\x00';
      for (let i = 0; i < ascii.length; i++) {
        words[i >> 2] |= ascii.charCodeAt(i) << (((3 - i) % 4) * 8);
      }
      words[words.length] = (asciiBitLength / maxWord) | 0;
      words[words.length] = asciiBitLength;
      for (let j = 0; j < words.length; ) {
        const w = words.slice(j, (j += 16));
        const oldHash = hash;
        hash = hash.slice(0, 8);
        for (let i = 0; i < 64; i++) {
          const w15 = w[i - 15], w2 = w[i - 2];
          const a = hash[0], e = hash[4];
          const temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i] +
            (w[i] = i < 16 ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
          const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash = [(temp1 + temp2) | 0].concat(hash);
          hash[4] = (hash[4] + temp1) | 0;
        }
        for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
      }
      for (let i = 0; i < 8; i++) {
        for (let j = 3; j + 1; j--) {
          const b = (hash[i] >> (j * 8)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result;
    };

    const hashPassword = async (plainText) => {

          return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
        }
      } catch {}
      return sha256Fallback(salted);
    };

      return Object.values(obj).filter(Boolean);

      return await res.json();

    const formatVNDateTime = (tsOrDate = Date.now()) => {
      const date = tsOrDate instanceof Date ? tsOrDate : new Date(Number(tsOrDate) || Date.now());
      try {
        const parts = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Asia/Ho_Chi_Minh',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false

        const get = (t) => parts.find((p) => p.type === t)?.value || '00';
        const hh = get('hour') === '24' ? '00' : get('hour');
        return `${hh}:${get('minute')} • ${get('day')}/${get('month')}/${get('year')}`;

        const vn = new Date(date.getTime() + 7 * 3600 * 1000);

    // ==========================================

      const [currentUserId, setCurrentUserId] = useState(() => loadLocal('currentUserId', null));

      const [cloudStatus, setCloudStatus] = useState('syncing'); // syncing | connected | error
      const [isInitialLoading, setIsInitialLoading] = useState(true);

      const [emailJsConfig, setEmailJsConfig] = useState(() =>
        loadLocal('emailJsConfig', { serviceId: '', templateId: '', publicKey: '' })
      );

      // Zoom ảnh toàn màn hình
      const [zoomedImage, setZoomedImage] = useState(null);

      // Toast
      const [toast, setToast] = useState(null);
      const showToast = (message) => setToast({ message, id: Date.now() });
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 3500);
        return () => clearTimeout(t);
      }, [toast]);

      // Lưu phiên cá nhân cục bộ (F5 giữ nguyên tài khoản đang đăng nhập)
      useEffect(() => { saveLocal('currentUserId', currentUserId); }, [currentUserId]);
      useEffect(() => { saveLocal('activeNav', activeNav); }, [activeNav]);
      useEffect(() => {
        if (currentUserId) {
          setSavedPostIds(loadLocal(`savedPosts_${currentUserId}`, []));
        } else {
          setSavedPostIds([]);
        }
      }, [currentUserId]);
      useEffect(() => {
        if (currentUserId) {
          saveLocal(`savedPosts_${currentUserId}`, savedPostIds);
        }
      }, [savedPostIds, currentUserId]);
      useEffect(() => { saveLocal('cloudUrl', cloudUrl); }, [cloudUrl]);
      useEffect(() => { saveLocal('emailJsConfig', emailJsConfig); }, [emailJsConfig]);

      // Áp dữ liệu từ Firebase vào state
      const applyRemoteData = (data) => {
        if (!data || typeof data !== 'object') return;
        if (data.categories) setCategories(mapToArray(data.categories).sort((a, b) => (a.id_dm || '').localeCompare(b.id_dm || '')));
        if (data.users) setUsers(mapToArray(data.users).sort((a, b) => (a.id_nd || '').localeCompare(b.id_nd || '')));
        if (data.adminWhitelist) setAdminWhitelist(mapToArray(data.adminWhitelist));
        if (data.posts) setPosts(mapToArray(data.posts).sort((a, b) => (b.created_ts || 0) - (a.created_ts || 0)));
        if (data.conversations) setConversations(mapToArray(data.conversations).sort((a, b) => (b.created_ts || 0) - (a.created_ts || 0)));
        if (data.messages) setMessages(mapToArray(data.messages).sort((a, b) => (a.sent_ts || 0) - (b.sent_ts || 0)));
        if (data.reports) setReports(mapToArray(data.reports).sort((a, b) => (b.created_ts || 0) - (a.created_ts || 0)));
      };

      // Khởi tạo & tự động đồng bộ thời gian thực với Firebase RTDB (mỗi 3 giây)
      useEffect(() => {
        let cancelled = false;
        const activeUrl = normalizeCloudUrl(cloudUrl);
        if (!activeUrl) {
          setCloudStatus('error');
          setIsInitialLoading(false);
          return;
        }

        const syncOnce = async (isFirst = false) => {
          try {
            const remote = await fbGetRoot(activeUrl);
            if (cancelled) return;
            if (!remote || !remote.meta || !remote.meta.seeded) {
              // Khởi tạo dữ liệu mẫu lần đầu duy nhất lên Firebase
              const seedPayload = {
                meta: { seeded: true, created_at: formatVNDateTime() },
                categories: arrayToMap(INITIAL_CATEGORIES, (c) => c.id_dm),
                users: arrayToMap(INITIAL_USERS, (u) => u.id_nd),
                adminWhitelist: arrayToMap(INITIAL_ADMIN_WHITELIST, (a) => safeFirebaseKey(a.email)),
                posts: arrayToMap(INITIAL_POSTS, (p) => p.id_bd),
                conversations: arrayToMap(INITIAL_CONVERSATIONS, (c) => c.id_ht),
                messages: arrayToMap(INITIAL_MESSAGES, (m) => m.id_tn),
                reports: arrayToMap(INITIAL_REPORTS, (r) => r.id_kn)
              };
              await fetch(`${activeUrl}/${DB_ROOT}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(seedPayload)
              });
              applyRemoteData(seedPayload);
            } else {
              applyRemoteData(remote);
            }
            setCloudStatus('connected');
          } catch (err) {
            if (!cancelled) setCloudStatus('error');
          } finally {
            if (isFirst && !cancelled) setIsInitialLoading(false);
          }
        };

        syncOnce(true);
        const interval = setInterval(() => syncOnce(false), 3000);
        const onFocus = () => syncOnce(false);
        window.addEventListener('focus', onFocus);
        return () => {
          cancelled = true;
          clearInterval(interval);
          window.removeEventListener('focus', onFocus);
        };
      }, [cloudUrl]);

      const currentUser = useMemo(
        () => (currentUserId ? users.find((u) => u.id_nd === currentUserId) || null : null),
        [currentUserId, users]
      );
      const isAdmin = currentUser?.id_vt === 'VT02';

      useEffect(() => {
        if (activeNav === 'admin' && !isAdmin) setActiveNav('home');

      // ==========================================
      // STATE ĐĂNG NHẬP / ĐĂNG KÝ

      const [authTab, setAuthTab] = useState('login');

      const [authLoading, setAuthLoading] = useState(false);

      const isEmailJsConfigured = Boolean(
        emailJsConfig.serviceId?.trim() && emailJsConfig.templateId?.trim() && emailJsConfig.publicKey?.trim()
      );

      useEffect(() => {
        if (authTab !== 'otp' || otpTimer <= 0) return;
        const interval = setInterval(() => setOtpTimer((p) => (p > 0 ? p - 1 : 0)), 1000);
        return () => clearInterval(interval);
      }, [authTab, otpTimer]);

      // ==========================================
      // STATE GIAO DIỆN, TÌM KIẾM, MODAL & CHAT
      // ==========================================
      const [searchKeyword, setSearchKeyword] = useState('');

      const [viewingPost, setViewingPost] = useState(null);

      const [postForm, setPostForm] = useState({

      // Chat
      const [activeConversationId, setActiveConversationId] = useState(null);

      const chatEndRef = useRef(null);
      const chatInputRef = useRef(null);

      // Khiếu nại
      const [reportingPost, setReportingPost] = useState(null);
      const [reportReason, setReportReason] = useState('Thông tin sai');
      const [reportDesc, setReportDesc] = useState('');
      const [reportError, setReportError] = useState('');
      const [viewingReport, setViewingReport] = useState(null);

      // Hồ sơ
      const [profileForm, setProfileForm] = useState({ ho_ten: '', truong_vien: '' });
      useEffect(() => {
        if (currentUser) {
          setProfileForm({
            ho_ten: currentUser.ho_ten,
            truong_vien: currentUser.truong_vien || 'Trường Điện - Điện tử (SEEE)'

      // Admin
      const [adminTab, setAdminTab] = useState('stats');
      const [confirmUserLock, setConfirmUserLock] = useState(null);
      const [newCategoryName, setNewCategoryName] = useState('');
      const [newCategoryDesc, setNewCategoryDesc] = useState('');
      const [categoryError, setCategoryError] = useState('');
      const [newAdminEmail, setNewAdminEmail] = useState('');
      const [newAdminName, setNewAdminName] = useState('');
      const [adminWhitelistError, setAdminWhitelistError] = useState('');

      const getCategoryName = (idDm) => categories.find((c) => c.id_dm === idDm)?.ten_dm || 'Khác';
      const getUserById = (idNd) => users.find((u) => u.id_nd === idNd) || {
        id_nd: idNd, ho_ten: 'Sinh viên HUST', email: 'sv@sis.hust.edu.vn', avatar: 'SV'
      };
      const validateHustEmail = (email) => {
        const t = email.trim().toLowerCase();
        return t.endsWith('@sis.hust.edu.vn') && t.indexOf('@') > 0;
      };

      // ==========================================
      // XỬ LÝ ĐĂNG NHẬP / ĐĂNG KÝ / OTP
      // ==========================================
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (!validateHustEmail(authEmail)) {
          setAuthError('Hệ thống chỉ hỗ trợ tài khoản email @sis.hust.edu.vn');
          return;
        }
        if (!authPassword || authPassword.trim().length < 4) {
          setAuthError('Vui lòng nhập mật khẩu.');
          return;
        }
        setAuthLoading(true);
        try {
          // Lấy danh sách user mới nhất từ Firebase để chắc chắn không bỏ sót user mới đăng ký từ máy khác
          let latestUsers = users;
          let latestWhitelist = adminWhitelist;
          try {
            const remote = await fbGetRoot(cloudUrl);
            if (remote?.users) {
              latestUsers = mapToArray(remote.users);
              setUsers(latestUsers);
            }
            if (remote?.adminWhitelist) {
              latestWhitelist = mapToArray(remote.adminWhitelist);
              setAdminWhitelist(latestWhitelist);
            }
          } catch {}

          const normalizedEmail = authEmail.trim().toLowerCase();
          const foundUser = latestUsers.find((u) => u.email.toLowerCase() === normalizedEmail);
          if (!foundUser) {
            setAuthError('Email hoặc mật khẩu không chính xác.');
            return;
          }
          if (foundUser.trang_thai === 'BI_KHOA') {
            setAuthError('Tài khoản này đã bị Quản trị viên khóa do vi phạm quy chế Chợ BK.');
            return;
          }
          const inputHash = await hashPassword(authPassword);
          const isMatch = foundUser.password_hash
            ? foundUser.password_hash === inputHash
            : foundUser.password === authPassword;
          if (!isMatch) {
            setAuthError('Email hoặc mật khẩu không chính xác.');
            return;
          }

          const adminEntry = latestWhitelist.find((a) => a.email.toLowerCase() === normalizedEmail);
          const resolvedRole = adminEntry ? 'VT02' : 'VT01';
          if (foundUser.id_vt !== resolvedRole) {
            setUsers((prev) => prev.map((u) => (u.id_nd === foundUser.id_nd ? { ...u, id_vt: resolvedRole } : u)));
            await fbPatchItem(cloudUrl, 'users', foundUser.id_nd, { id_vt: resolvedRole });
          }
          const nextNav = resolvedRole === 'VT02' ? 'admin' : 'home';
          setCurrentUserId(foundUser.id_nd);
          setActiveNav(nextNav);
          setAuthPassword('');
          showToast(`Đăng nhập thành công! Xin chào ${foundUser.ho_ten}.`);
        } finally {
          setAuthLoading(false);
        }
      };

      const sendRealOtpEmail = async (toEmail, toName, otpCode) => {
        const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            service_id: emailJsConfig.serviceId.trim(),
            template_id: emailJsConfig.templateId.trim(),
            user_id: emailJsConfig.publicKey.trim(),
            template_params: { to_email: toEmail, to_name: toName, otp_code: otpCode }
          })
        });
        return res.ok;
      };

      const createAccountNow = async () => {
        const normalizedEmail = authEmail.trim().toLowerCase();
        const adminEntry = adminWhitelist.find((a) => a.email.toLowerCase() === normalizedEmail);
        const targetRole = adminEntry ? 'VT02' : 'VT01';
        const newId = `ND${Date.now().toString().slice(-6)}${Math.floor(Math.random() * 100)}`;
        const displayName = adminEntry ? adminEntry.ho_ten : authName.trim();
        const pwHash = await hashPassword(authPassword);

        const newUser = {
          id_nd: newId,
          id_vt: targetRole,
          email: normalizedEmail,
          password_hash: pwHash,
          ho_ten: displayName,
          mssv: adminEntry ? adminEntry.mssv : '2024xxxx',
          truong_vien: adminEntry ? 'Ban Quản Trị Hệ Thống ĐHBK Hà Nội' : 'Trường Điện - Điện tử (SEEE)',
          trang_thai: 'HOAT_DONG',
          ngay_tao: formatVNDateTime(),
          avatar: displayName.slice(0, 2).toUpperCase()
        };

        setUsers((prev) => [...prev, newUser]);
        await fbPutItem(cloudUrl, 'users', newId, newUser);
        const nextNav = targetRole === 'VT02' ? 'admin' : 'home';
        setCurrentUserId(newId);
        setActiveNav(nextNav);
        setAuthPassword('');
        setAuthConfirmPassword('');
        setInputOtp('');
        setPendingOtpHash('');
        showToast('Đăng ký tài khoản thành công! Chào mừng bạn đến với Chợ BK.');
      };

      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (!authName.trim()) { setAuthError('Vui lòng nhập họ và tên sinh viên.'); return; }
        if (!validateHustEmail(authEmail)) { setAuthError('Hệ thống chỉ hỗ trợ tài khoản email @sis.hust.edu.vn'); return; }
        const normalizedEmail = authEmail.trim().toLowerCase();
        if (users.some((u) => u.email.toLowerCase() === normalizedEmail)) {
          setAuthError('Email này đã được đăng ký. Vui lòng chuyển sang tab Đăng nhập.');
          return;
        }
        if (!authPassword || authPassword.length < 6) { setAuthError('Mật khẩu phải có ít nhất 6 ký tự.'); return; }
        if (authPassword !== authConfirmPassword) { setAuthError('Mật khẩu xác nhận không khớp.'); return; }

        if (isEmailJsConfigured) {
          setAuthLoading(true);
          try {
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            const ok = await sendRealOtpEmail(normalizedEmail, authName.trim(), code);
            if (!ok) { setAuthError('Không thể gửi email OTP qua EmailJS.'); return; }
            setPendingOtpHash(await hashPassword(code));

      const handleImageFileChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          setPostErrors((p) => ({ ...p, anh_tai_len: 'Vui lòng chọn tệp ảnh hợp lệ (JPG, PNG, WEBP).' }));
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          setPostErrors((p) => ({ ...p, anh_tai_len: 'Dung lượng ảnh tối đa 5MB.' }));
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 900;
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
              else { width = Math.round((width * maxDim) / height); height = maxDim; }
            }
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL('image/jpeg', 0.72);
            setPostForm((p) => ({ ...p, anh_tai_len: compressed }));
            setPostErrors((p) => ({ ...p, anh_tai_len: null }));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      };

          {zoomedImage && (
            <div onClick={() => setZoomedImage(null)} className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4 cursor-zoom-out">
              <button type="button" onClick={() => setZoomedImage(null)} className="absolute top-4 right-4 bg-white/15 hover:bg-white/25 text-white p-2 rounded-full">
                <Icon name="X" className="w-6 h-6" />
              </button>
              <img src={zoomedImage} alt="Phóng to sản phẩm" className="max-w-full max-h-[92vh] object-contain rounded-lg shadow-2xl" />
            </div>
          )}

          {/* MODAL KHIẾU NẠI */}
          {reportingPost && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
                <div className="bg-amber-600 px-5 py-3.5 text-white flex items-center justify-between">
                  <span className="font-extrabold text-sm flex items-center gap-2"><Icon name="Flag" className="w-4 h-4" /><span>Gửi Báo Cáo Khiếu Nại</span></span>
                  <button type="button" onClick={() => setReportingPost(null)}><Icon name="X" className="w-4 h-4" /></button>
                </div>
                <form onSubmit={handleSubmitReport} className="p-5 space-y-3.5">
                  <div className="text-xs bg-slate-50 p-3 rounded-xl border border-slate-200">Bài đăng: <strong>{reportingPost.tieu_de}</strong> ({reportingPost.id_bd})</div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Lý do khiếu nại</label>
                    <select value={reportReason} onChange={(e) => setReportReason(e.target.value)} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
                      <option value="Thông tin sai">Thông tin sản phẩm sai sự thật</option>
                      <option value="Nghi ngờ lừa đảo">Nghi ngờ lừa đảo / yêu cầu cọc bất thường</option>
                      <option value="Hàng cấm / Vi phạm">Sản phẩm vi phạm nội quy Chợ BK</option>
                      <option value="Khác">Lý do khác</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Mô tả chi tiết *</label>
                    <textarea rows={3} value={reportDesc} onChange={(e) => { setReportDesc(e.target.value); setReportError(''); }} placeholder="Mô tả rõ hành vi vi phạm..." className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm outline-none" />
                    {reportError && <p className="text-[11px] font-bold text-red-600 mt-1">{reportError}</p>}
                  </div>
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setReportingPost(null)} className="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">Hủy</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-amber-600 text-white font-bold text-xs">Gửi khiếu nại</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL CHI TIẾT KHIẾU NẠI (ADMIN) */}
          {viewingReport && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl">
                <div className="bg-slate-900 px-5 py-3.5 text-white flex items-center justify-between">
                  <span className="font-extrabold text-sm">Chi Tiết Phiếu Khiếu Nại ({viewingReport.id_kn})</span>
                  <button type="button" onClick={() => setViewingReport(null)}><Icon name="X" className="w-4 h-4" /></button>
                </div>
                <div className="p-5 space-y-4 text-xs">
                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-3.5 space-y-1.5">
                    <div className="flex items-center justify-between">
                      <span className="font-extrabold text-amber-900">Lý do: {viewingReport.ly_do}</span>
                      <span className="font-extrabold px-2 py-0.5 rounded-full bg-white text-amber-900">{viewingReport.trang_thai}</span>
                    </div>
                    <p className="text-slate-700">{viewingReport.mo_ta}</p>
                    <div className="text-[11px] text-slate-500">Người báo cáo: <strong>{getUserById(viewingReport.id_nguoi_gui).ho_ten}</strong> • {viewingReport.ngay_gui}</div>
                  </div>
                  <div className="flex flex-wrap justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onClick={() => handleAdminProcessReport(viewingReport, 'DA_XU_LY', false)} className="px-3.5 py-2 rounded-xl bg-emerald-600 text-white font-bold">Duyệt đã xử lý</button>
                    <button type="button" onClick={() => { handleAdminProcessReport(viewingReport, 'DA_XU_LY', true); setViewingReport(null); }} className="px-3.5 py-2 rounded-xl bg-red-600 text-white font-bold">Gỡ bài vi phạm</button>
                    <button type="button" onClick={() => handleAdminProcessReport(viewingReport, 'TU_CHOI', false)} className="px-3.5 py-2 rounded-xl bg-slate-200 text-slate-700 font-bold">Từ chối</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL XÓA BÀI */}
          {confirmDeletePost && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                <div className="flex items-center gap-2.5 text-red-700 font-extrabold"><Icon name="AlertTriangle" className="w-5 h-5" /><span>Xác nhận xóa bài đăng</span></div>
                <p className="text-xs text-slate-600">Bạn có chắc chắn muốn xóa bài đăng <strong>"{confirmDeletePost.tieu_de}"</strong> khỏi hệ thống?</p>
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setConfirmDeletePost(null)} className="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">Hủy</button>
                  <button type="button" onClick={handleConfirmDeletePost} className="px-4 py-2 rounded-xl bg-red-600 text-white font-bold text-xs">Xóa vĩnh viễn</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL KHÓA TÀI KHOẢN */}
          {confirmUserLock && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                <div className="flex items-center gap-2.5 text-amber-700 font-extrabold"><Icon name="ShieldAlert" className="w-5 h-5" /><span>Xác nhận {confirmUserLock.trang_thai === 'BI_KHOA' ? 'mở khóa' : 'khóa'} tài khoản</span></div>
                <p className="text-xs text-slate-600">Bạn có chắc chắn muốn <strong>{confirmUserLock.trang_thai === 'BI_KHOA' ? 'mở khóa' : 'khóa'}</strong> tài khoản <strong>{confirmUserLock.ho_ten}</strong>?</p>
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setConfirmUserLock(null)} className="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">Hủy</button>
                  <button type="button" onClick={handleExecuteUserLock} className="px-4 py-2 rounded-xl bg-red-600 text-white font-bold text-xs">Xác nhận</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
