<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F7B4F">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <title>Badminton Connect – Ghép sân cầu lông</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bản đồ miễn phí Leaflet + OpenStreetMap (không cần API key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- Thanh bên (máy tính) -->
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="index.html">
      <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="18" r="3.2" fill="currentColor"/><path d="M9.2 16 6.5 4.5M12 15V3.5M14.8 16l2.7-11.5M6.5 4.5Q12 2.5 17.5 4.5"/></svg></span>
      Badminton Connect
    </a>
    <nav id="side-nav" aria-label="Điều hướng chính"></nav>
    <div class="sidebar-foot" id="side-foot"></div>
  </aside>

  <!-- Thanh trên (điện thoại) -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="18" r="3.2" fill="currentColor"/><path d="M9.2 16 6.5 4.5M12 15V3.5M14.8 16l2.7-11.5M6.5 4.5Q12 2.5 17.5 4.5"/></svg></span>
      Connect
    </a>
    <div class="row" id="top-actions"></div>
  </header>

  <main class="main" id="main">

    <!-- 1. TÌM SÂN -->
    <section class="view" id="view-courts" aria-labelledby="h-courts">
      <div class="page-head">
        <h1 id="h-courts">Tìm kèo ghép sân</h1>
        <p class="sub">Chọn kèo phù hợp và gửi yêu cầu chỉ trong vài chạm.</p>
      </div>

      <div class="search-row">
        <label class="search">
          <span class="sr-only">Tìm kiếm</span>
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="f-q" type="search" placeholder="Tìm sân, địa chỉ, quận…" autocomplete="off">
        </label>
        <button class="btn" id="btn-filters" type="button" aria-expanded="false" aria-controls="filters-panel">
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          Bộ lọc <span class="badge" id="filter-count" hidden>0</span>
        </button>
      </div>

      <div class="datestrip" id="date-strip" role="group" aria-label="Chọn ngày chơi"></div>
      <div class="chips" id="quick-chips" aria-label="Lọc nhanh"></div>

      <div class="filters" id="filters-panel" hidden>
        <div class="field"><label for="f-district">Quận / Huyện</label><select id="f-district"></select></div>
        <div class="field"><label for="f-date">Ngày chơi</label><input id="f-date" type="date"></div>
        <div class="field"><label for="f-from">Từ giờ</label><input id="f-from" type="time"></div>
        <div class="field"><label for="f-to">Đến giờ</label><input id="f-to" type="time"></div>
        <div class="field"><label for="f-skill">Trình độ của tôi</label><select id="f-skill"></select></div>
        <div class="field"><label for="f-price">Chi phí mỗi người</label>
          <select id="f-price">
            <option value="">Mọi mức giá</option><option value="50000">Dưới 50.000đ</option><option value="80000">Dưới 80.000đ</option>
            <option value="100000">Dưới 100.000đ</option><option value="150000">Dưới 150.000đ</option>
          </select></div>
        <div class="field"><label for="f-sort">Sắp xếp</label>
          <select id="f-sort">
            <option value="soonest">Sắp diễn ra</option><option value="price_asc">Giá thấp đến cao</option><option value="price_desc">Giá cao đến thấp</option>
            <option value="slots">Còn nhiều chỗ nhất</option><option value="newest">Mới đăng</option><option value="near" disabled>Gần tôi nhất (bật vị trí)</option>
          </select></div>
        <div class="field wide"><label class="check"><input id="f-avail" type="checkbox"> Chỉ hiện kèo còn chỗ</label></div>
        <div class="field wide"><button class="btn ghost" id="btn-clear" type="button">Xóa tất cả bộ lọc</button></div>
      </div>

      <div class="results-bar">
        <span><span id="result-count">Đang tải…</span> <span class="live-dot" id="live-dot" title="Số chỗ trống được cập nhật theo thời gian thực">Trực tiếp</span></span>
        <div class="seg only-mobile" id="view-toggle" role="group" aria-label="Kiểu hiển thị">
          <button type="button" data-mode="list" class="active">Danh sách</button>
          <button type="button" data-mode="map">Bản đồ</button>
        </div>
      </div>

      <div class="courts-layout" id="courts-layout">
        <div class="list-col" id="court-list"></div>
        <div class="map-col">
          <div id="map"></div>
          <div class="map-tools"><button class="btn sm" id="btn-locate" type="button">Vị trí của tôi</button></div>
        </div>
      </div>
    </section>

    <!-- 2. KÈO CỦA TÔI (chủ sân) -->
    <section class="view" id="view-mine"></section>
    <!-- 3. LỊCH CHƠI -->
    <section class="view" id="view-bookings"></section>
    <!-- 4. THÔNG BÁO -->
    <section class="view" id="view-notifications"></section>
    <!-- 5. CÁ NHÂN -->
    <section class="view" id="view-profile"></section>
    <!-- 6. QUẢN TRỊ -->
    <section class="view" id="view-admin"></section>
  </main>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Điều hướng chính"></nav>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toasts" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="common.js"></script>
<script src="main.js"></script>
<script src="host.js"></script>
<script src="extras.js"></script>
<script>App.boot();</script>
</body>
</html>
