{% extends 'base.html' %}
{% block title %}Tra cứu đơn{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card"><div class="card-body">
    <h4 class="mb-3">Tra cứu đơn đặt phòng</h4>
    <form method="post">{% csrf_token %}
      {% for field in form %}<div class="mb-3">{{ field.label_tag }}{{ field }}</div>{% endfor %}
      <button class="btn btn-primary">Tra cứu</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
